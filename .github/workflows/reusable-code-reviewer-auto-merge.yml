name: Auto-merge on code reviewer approval

on:
  workflow_call:
    secrets:
      LUCOS_CI_APP_ID:
        required: true
      LUCOS_CI_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Allow approvals from either lucos-code-reviewer[bot] or lucas42.
    # The step below validates which is expected for this repo based on
    # unsupervisedAgentCode from configy.
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      (
        (github.event.review.user.login == 'lucos-code-reviewer[bot]' && github.event.review.user.id == 264151378) ||
        (github.event.review.user.login == 'lucas42' && github.event.review.user.id == 428847)
      )
    steps:
      - name: Check unsupervisedAgentCode and decide whether to merge
        id: check-reviewer
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REVIEWER_LOGIN: ${{ github.event.review.user.login }}
        run: |
          # Fetch repo config from configy, retrying to ride out transient failures.
          # Three distinct states must be distinguished:
          #   1. configy says unsupervisedAgentCode=true  → bot approval is correct → merge
          #   2. configy says unsupervisedAgentCode=false → human review expected   → skip (correct silence)
          #   3. lookup failed (network error / non-200 / field absent)             → fail loudly (NOT silent skip)
          # States 2 and 3 must NOT collapse to the same output — a silent skip
          # for state 3 is indistinguishable from state 2 and strands PRs without
          # any signal of failure.
          LOOKUP_SUCCESS=false
          UNSUPERVISED=""

          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s --max-time 30 \
              -o /tmp/configy_response.json \
              -w "%{http_code}" \
              "https://configy.l42.eu/repositories/${REPO_NAME}" \
              -H "Accept: application/json" 2>/dev/null)
            CURL_EXIT=$?

            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
              CONFIGY_RESPONSE=$(cat /tmp/configy_response.json)
              if echo "$CONFIGY_RESPONSE" | jq -e 'has("unsupervisedAgentCode")' > /dev/null 2>&1; then
                UNSUPERVISED=$(echo "$CONFIGY_RESPONSE" | jq -r '.unsupervisedAgentCode')
                LOOKUP_SUCCESS=true
                break
              fi
              echo "Attempt ${attempt}/3: configy returned HTTP 200 but 'unsupervisedAgentCode' field absent in response"
            else
              echo "Attempt ${attempt}/3: configy lookup failed (curl_exit=${CURL_EXIT}, http_code=${HTTP_CODE})"
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          if [ "$LOOKUP_SUCCESS" != "true" ]; then
            echo "::error::Could not determine supervision status for ${REPO_NAME} after 3 attempts. Re-run this workflow once configy is reachable."
            exit 1
          fi

          echo "unsupervisedAgentCode=${UNSUPERVISED}"

          if [ "$UNSUPERVISED" = "true" ]; then
            EXPECTED_REVIEWER="lucos-code-reviewer[bot]"
          else
            EXPECTED_REVIEWER="lucas42"
          fi

          if [ "$REVIEWER_LOGIN" = "$EXPECTED_REVIEWER" ]; then
            echo "Reviewer '${REVIEWER_LOGIN}' matches expected reviewer for this repo. Proceeding with auto-merge."
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "Reviewer '${REVIEWER_LOGIN}' is not the expected reviewer '${EXPECTED_REVIEWER}' for this repo (unsupervisedAgentCode=${UNSUPERVISED}). Skipping auto-merge."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.check-reviewer.outputs.should_merge == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LUCOS_CI_APP_ID }}
          private-key: ${{ secrets.LUCOS_CI_PRIVATE_KEY }}
      # Use a GitHub App token instead of GITHUB_TOKEN because GITHUB_TOKEN
      # events don't trigger downstream workflows or side-effects.
      - name: Enable auto-merge
        if: steps.check-reviewer.outputs.should_merge == 'true'
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --auto --merge "$PR_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt ${attempt} failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            fi
          done
          echo "All retry attempts exhausted"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
